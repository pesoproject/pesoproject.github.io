- slug: spack
  source: 2026-08-05-PESO-Spack-Highlight.pptx
  title: Spack Grows the Commons
  caption: >-
    Spack is the open-source package manager the HPC community built to avoid re-solving the same
    dependency problems at every institution. With support from PESO and the High Performance Software
    Foundation, Spack's 1.2 release adds an interactive parallel installer, concretization groups,
    cached concretization (cutting a typical dependency resolve from about 6 seconds to under 2), and
    SBOM generation for supply-chain transparency. Over the past two years, the project has grown from
    about 1,400 to more than 1,600 contributors and from 8,200 to 8,800 packages, with neutral
    governance under the Linux Foundation.
  notes_excerpt: 'LOCAL LAB POC:

    Todd Gamblin


    TALKING POINTS:

    Open science depends on shared software infrastructure and building that software is often the hardest
    part. Every research group that wants to run HPC applications must resolve compilers, libraries, and
    dependencies before a single simulation runs — work that is largely the same from one institution
    to the next, yet has traditionally been redone in isolation everywhere.

    Spack is the open-source package manager the community built to stop repeating that work. Maintained
    by a large international community and supported through PESO and the High Performance Software Foundation,
    Spack automates builds of scientific software and its dependencies, with a simple, parameterized syntax
    that lets users tune configuration without hand-editing build scripts. It is the foundation of DOE''s
    E4S software stack.

    The 1.2 release adds four capabilities the community asked for: an interactive parallel installer
    with a live terminal UI, concretization groups that let independently-solved parts of a spec reuse
    each other''s results, cached concretization that stores and retrieves solver output by hash, and
    SBOM generation in the SPDX 2.3 standard for supply-chain security. Concretization caching alone cut
    a three-solve sequence down to one, and a typical spec resolve from 6.21 seconds to 1.79.

    Over the past two years the project has grown from 1,400 to more than 1,600 contributors and from
    8,200 to 8,800 packages, joined the Linux Foundation, and set up neutral governance so no single institution
    controls its direction. Documentation-site visits arrive from nearly every country, and the user base
    spans research software engineers, developers, system administrators, and computational scientists
    in roughly equal measure — evidence that Spack has become genuinely shared infrastructure rather than
    a single lab''s tool.

    That is the DOE mission in practice: public investment in open software that any research group, anywhere,
    can build on, verify, and extend — and that keeps getting faster and more secure as the community
    that relies on it keeps growing.


    METADATA:

    Name of the associated awarded project: PESO, Consortium for the Advancement of Scientific Software
    (CASS)

    PI names: Michael Heroux (ParaTools, Inc.), Lois Curfman McInnes (Argonne National Laboratory)

    Spack technical lead: Todd Gamblin (Lawrence Livermore National Laboratory)

    Name of the program manager: David Rabson, ASCR Next-Generation Scientific Software Technologies


    CITATIONS:

    [to be completed before submission] Add full citations, including DOIs, for the associated Spack publications,
    and confirm that accepted manuscripts have been submitted to OSTI. At least one publication citation
    should also appear on the slide itself.

    Software references: Spack, https://spack.io ; source, https://github.com/spack/spack ; E4S, https://e4s.io
    .


    AWARDS:

    [none noted; add if applicable]


    REPRODUCIBILITY:

    Spack''s cached concretization stores solver results by input hash, and SBOM generation records the
    exact supplier, version, and dependency graph of every installed package — together giving a verifiable
