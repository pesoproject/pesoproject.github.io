- slug: e4s
  source: 2026-08-06-E4S Highlight - Dont Debug It Alone .pptx
  title: 'E4S: A Ready-to-Run Environment for New Researchers'
  caption: >-
    E4S (Ecosystem for Science) is a curated, tested collection of more than 100 open-source scientific
    libraries and tools, deployed via Spack, containers, and facility installations across CPU and GPU
    platforms from NVIDIA, AMD, and Intel. For new students, postdocs, and their mentors, starting from
    a working, validated environment can reduce time spent on setup, leaving more time for research.
    The same curated environment can move from a laptop to DOE leadership-class systems, supporting
    reproducibility as people and projects move between machines.
  notes_excerpt: 'LOCAL LAB POC:

    Sameer Shende, University of Oregon, Argonne National Laboratory


    TALKING POINTS:

    New researchers, and the mentors who supervise them, routinely lose their first days or weeks on a
    project to software setup rather than science. Configuring compilers, libraries, programming models,
    and dependencies so they work together on a given system is its own specialized skill, one that has
    nothing to do with the research question at hand.

    E4S, the Ecosystem for Science, exists to remove that barrier. It is a curated, tested, and interoperable
    collection of more than 100 open-source scientific libraries, tools, and applications, deployed through
    Spack, prebuilt containers, and facility-ready installations, with broad support for NVIDIA, AMD,
    and Intel CPU and GPU architectures.

    In addition to easy access to the E4S collection of libraries, tools, and apps, users can access the
    E4S website (https://e4s.io) for quickstart recipes, a searchable and sortable product catalog, and
    an AI guidebot to answer user questions.

    The practical effect is on onboarding. A new student or postdoc, and the mentor who would otherwise
    walk them through the stack by hand, can instead start from a working, validated environment. Time
    that used to go to troubleshooting goes to the research itself.

    This also benefits reproducibility and portability: the same curated environment that gets a newcomer
    running on a laptop is deployed and tested on DOE leadership-class systems, so a project''s software
    environment does not have to be rebuilt as people move between machines or as new team members join.

    PESO''s investment in E4S is DOE turning software infrastructure into faster, more reliable onboarding
    for the next generation of computational scientists.


    METADATA:

    Name of the associated awarded project: PESO, Consortium for the Advancement of Scientific Software
    (CASS)

    PI names: Michael Heroux (ParaTools, Inc.), Lois Curfman McInnes (Argonne National Laboratory)

    E4S lead: Sameer Shende (University of Oregon / Argonne National Laboratory.)

    Name of the program manager: David Rabson, ASCR Next-Generation Scientific Software Technologies


    Software references: E4S, https://e4s.io ; Spack, https://spack.io .


    E4S publishes curated, versioned releases of the full software stack, so a container tag plus a Spack
    specification is sufficient to reconstruct the exact software environment used by a project or a new
    team member.'
  thumbnail: /files/highlights/e4s/thumbnail.png
  pdf: /files/highlights/e4s/slide.pdf
- slug: zero-to-lammps
  source: 2026.08.ASCR.Highlight.PESO.ZeroToLAMMPS.pptx
  title: From a Blank Laptop to a Running Simulation in Minutes
  caption: >-
    PESO delivers E4S through a small, cache-backed container that pairs Spack and MPICH with a build
    cache spanning the curated E4S collection. In one test on a laptop, pulling the image and installing
    LAMMPS — a widely used molecular dynamics code — together took under two minutes, after which a
    parallel simulation was running. Actual times will vary by hardware and network, but the approach
    is intended to turn software setup from a multi-day task into a short one, which can help
    AI-for-science workflows that depend on quickly generating simulation data.
  notes_excerpt: "LOCAL LAB POC: Michael Heroux, ParaTools, Inc. (mheroux@paratools.com) \n\nTALKING POINTS:\n\
    Scientific software is usually hard to install. A researcher who wants to try a new simulation code\
    \ often spends hours, sometimes days, resolving compilers, libraries, and dependencies before running\
    \ anything at all. That setup cost is a real barrier to entry, and it falls hardest on newcomers and\
    \ on scientists whose expertise is in the science rather than the software.\n\nE4S (Ecosystem for\
    \ Science) removes that barrier. The PESO project delivers it through what we call the E4S Cache-backed\
    \ Image: a deliberately small container holding just Spack and MPICH, backed by a Spack build cache\
    \ that reaches the entire curated E4S collection. The image stays small precisely because it does\
    \ not carry the software — it carries the means to fetch any of it, already built and already tested,\
    \ on demand.\n\nHere is what that looks like in practice on an ordinary laptop. Pulling the E4S Cache-backed\
    \ Image took 42 seconds. Installing LAMMPS, a widely used molecular dynamics code, took another 75\
    \ seconds. Two minutes after starting, we were running a real parallel simulation of 32,000 atoms\
    \ across four MPI ranks and four OpenMP threads per rank.\n\nThis matters well beyond convenience.\
    \ Running a simulation code is the first step in a great many AI-for-science workflows, such as generating\
    \ the training data behind a surrogate model. Making that first step take two minutes instead of two\
    \ days changes what researchers are willing to attempt.\n\nThe same Cache-backed Image runs unchanged\
    \ on a laptop, in the cloud, and on leadership-class systems, and published E4S releases let others\
    \ reproduce a computational result exactly. This is DOE software investment being turned into something\
    \ any scientist can pick up and use immediately.\n\nMETADATA:\nName of the associated awarded project:\
    \ PESO (Partnering for Scientific-software Ecosystem Stewardship Opportunities), Consortium for the\
    \ Advancement of Scientific Software (CASS)\nPI names: Michael Heroux (ParaTools, Inc.), Lois Curfman\
    \ McInnes (Argonne National Laboratory)\nE4S lead: Sameer Shende (University of Oregon / ParaTools,\
    \ Inc.)\nName of the program manager: David Rabson, ASCR Next-Generation Scientific Software Technologies\n\
    \nSoftware / product references: E4S, https://e4s.io ; Spack, https://spack.io ; LAMMPS, https://www.lammps.org\
    \ ; E4S Cache-backed Image, ecpe4s/e4s-spack-cpu.\n\nREPRODUCIBILITY: E4S publishes curated, versioned\
    \ releases of the full software stack, so a container tag plus a Spack specification is sufficient\
    \ to reconstruct the exact software environment used for a published run. Add any formal reproducibility\
    \ badges here if the associated publications carry them.\n\nBACKGROUND AND CONTEXT INFORMATION:\n\
    Terminology: the E4S Cache-backed Image is the minimal ecpe4s/e4s-spack-cpu container — Spack and\
    \ MPICH only — paired with the E4S Spack build cache that backs it. Use the full name on first mention\
    \ in any talk; \"Cache-backed Image\" is fine thereafter.\n\nTimings shown on the slide were measured\
    \ on a MacBook (aarch64) using the E4S Cache-backed Image, ecpe4s/e4s-spack-cpu:latest, and LAMMPS\
    \ 22 Jul 2025. The benchmark is the standard LAMMPS Lennard-Jones melt input, in.lj, with 32,000 atoms\
    \ for 100 timesteps: loop time 0.182 s on 16 processors, 548.3 timesteps/s, 17.545 Matom-step/s, with\
    \ 100.6% CPU use across 4 MPI tasks by 4 OpenMP threads. Numbers will vary with hardware and network\
    \ speed; the point is the order of magnitude, not the exact seconds.\n\nThe speed comes from the cache\
    \ half of the Cache-backed Image. Rather than compiling LAMMPS and its dependencies from source, Spack\
    \ retrieves prebuilt binaries that E4S has already built and tested against the image's compiler and\
    \ MPI, so an install that would normally take hours completes in about a minute.\n\nThe E4S Quick\
    \ Start guide at e4s.io presents this as four steps: download the Cache-backed Image, supply MPI code,\
    \ launch the container interactively, then compile and run. The E4S Guide Bot provides interactive\
    \ help alongside the documentation."
  thumbnail: /files/highlights/zero-to-lammps/thumbnail.png
  pdf: /files/highlights/zero-to-lammps/slide.pdf
