- slug: hpsf
  source: 2025-06-24-ASCR Highlight PESO-HPSF.pptx
  title: Strengthening the High Performance Software Foundation
  caption: >-
    PESO contributes staff time and resources to the High Performance Software Foundation (HPSF), a
    vendor-neutral home for open-source HPC software launched in 2024. HPSF's inaugural conference in
    May 2025 drew more than 200 participants from across the community. Supporting HPSF alongside many
    other organizations helps broaden the base of support for DOE-funded software, so it can be
    sustained well beyond any single program.
  notes_excerpt: "The PESO Project is stewarding and advancing the current and future ecosystem of HPC-AI\
    \ computing software as part of the Consortium for the Advancement of Scientific Software (CASS).\
    \ PESO contributes to the U.S. Department of Energy’s mission to advance scientific discovery, while\
    \ also helping build a modern, flexible, and comprehensive computing infrastructure that benefits\
    \ a broad spectrum of users. \n   \nThis highlight focuses on the High Performance Software Foundation,\
    \ an exciting new organization that provides a key element to preserving and sustaining DOE scientific\
    \ software investments that are critical for providing the scaffolding for scientific advancement\
    \ in AI for Science and modeling and simulation.\n\nHPSF obtains funds from its premier members that\
    \ are used to support community interactions, including the HPSF Annual Conference (HPSFCon).  HPSFCon\
    \ 2025 was the inaugural event in Chicago in May, bringing together more than 200 attendees from many\
    \ organizations for the purpose of expanding the quality, quantity, and use of open-source high-performance\
    \ software.\n\nHPSF plays a unique role as a neutral organization that anyone can join and trust to\
    \ promote the common good for the high-performance software community.  \n\nFor DOE/ASCR, HPSF plays\
    \ a critical role in enabling others outside of DOE to contribute money, time, and effort to sustain\
    \ DOE software investments, diversifying the support of successful DOE high-performance software products.\n\
    \nHPSF promises to be a natural software ecosystem expansion as a legacy to the US Exascale Computing\
    \ Project.  While ECP provided a first-of-a-kind focus on high-quality scientific software investments,\
    \ it was limited to DOE and its direct agency, industry, and international collaborators.  HPSF has\
    \ none of these restrictions and can expand to encompass high performance software activities that\
    \ are critical to DOE, and to US competitiveness and national security."
  thumbnail: /files/highlights/hpsf/thumbnail.png
  pdf: /files/highlights/hpsf/slide.pdf
- slug: dav-tools
  source: 2026-08 PESO-DAVTOOLS-highlight.pptx
  title: Sustaining DOE's HPC Software
  caption: >-
    PESO's DAV and TOOLS Integrations provide shared continuous-integration, packaging, and
    security-hardening infrastructure for widely used data-analysis, visualization, and
    performance-tools packages, including ADIOS2, HDF5, ParaView, and HPCToolkit. Recent work helped
    ADIOS2 raise its OpenSSF Scorecard from 7.1 to 8.6 and pass the OpenSSF Best Practices Badge, with
    new security policies extended to several other packages. This work is done in coordination with
    RAPIDS, STEP, E4S, FASTMath, and DOE facility partners, so improvements can reach users through E4S
    rather than being repeated separately by each product team.
  notes_excerpt: 'LOCAL LAB POC:

    [add name and contact]


    TALKING POINTS:

    DOE''s HPC software ecosystem depends on dozens of independently maintained open-source libraries
    and tools — ParaView, ADIOS2, HDF5, HPCToolkit, PAPI, and more — that all need to stay secure, interoperable,
    and deployable across every DOE computing facility. That sustainability burden is more than any single
    upstream team can carry alone.

    The PESO project''s DAV and TOOLS Integrations supply shared infrastructure instead: per-product continuous
    integration across GitHub and GitLab, Spack recipes that define how each package is built, and a security-hardening
    layer built on the OpenSSF Best Practices Badge and Scorecard frameworks, all tracked on a shared
    CLOMonitor dashboard fork.

    The results are concrete. ADIOS2''s OpenSSF Scorecard rose from 7.1 to 8.6 out of 10, enough to pass
    the Best Practices badge. New security policies now cover ADIOS2, Viskores, ZFP, Darshan, and PAPI.
    Supply-chain hardening — hashed CI dependencies, minimal workflow-token permissions, branch protection
    — has closed vulnerabilities across many of the products, and the same curated Spack environments
    are automatically deployed and refreshed on the Frontier exascale system, with Perlmutter and Aurora
    coming next.

    This matters beyond convenience. Quality and security work done once, centrally, by the DAV and TOOLS
    Integrations reaches every DOE facility and every downstream user through E4S, rather than being repeated
    — or skipped — by each individual product team separately.

    That is DOE software investment being turned into a more trustworthy, more sustainable exascale software
    ecosystem, in coordination with RAPIDS, STEP, E4S, FASTMath, and DOE facility partners.


    METADATA:

